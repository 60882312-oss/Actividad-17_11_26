<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estacionamiento</title>
    <link rel="stylesheet" href="styte.css">
</head>
<body>

    <main class="contenedor">
        <h1>Sistema de Estacionamiento</h1>

        <label>Placa del vehículo:</label>
        <input type="text" id="placa" placeholder="Ej. ABC-123">

        <label>Horas estacionadas:</label>
        <input type="number" id="horas" placeholder="Cantidad de horas">

        <button id="btnRegistrar">Registrar vehículo</button>

        <h2>Resumen de operaciones</h2>

        <div id="resumen">
            Aún no hay vehículos registrados.
        </div>

        <p id="totalGeneral">Total recaudado: S/ 0.00</p>

        <button id="btnLimpiar" class="secundario">
            Limpiar registros
        </button>
    </main>

    <script src="/script.js"></script>
</body>
</html>
